<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tecnología: ¿Lógico o ilógico?</title>
<style>
:root{--blue:#245fbe;--green:#248a47;--red:#c83d4d;--ink:#172033}
*{box-sizing:border-box}
body{margin:0;font-family:"Century Gothic",Arial,sans-serif;background:#eaf3ff;color:var(--ink)}
.wrap{max-width:1050px;margin:auto;padding:24px}
.card{background:#fff;border:9px solid #78a9ef;border-radius:30px;min-height:700px;box-shadow:0 15px 34px #234f9126;overflow:hidden}
.top{text-align:center;font-weight:800;font-size:30px;color:var(--blue);padding:25px 24px 8px}
.sub{text-align:center;color:#5f6d83;font-size:17px;padding-bottom:6px}
.progress{text-align:right;padding:8px 32px 12px;color:#64748b}
.screen{display:none;padding:34px 40px 46px}.screen.active{display:block}
.question{font-size:31px;font-weight:700;line-height:1.5;text-align:center;border:3px solid #d6e6ff;border-radius:20px;padding:34px;min-height:220px;display:flex;align-items:center;justify-content:center}
.options{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:760px;margin:34px auto 0}
.choice{padding:24px 20px;font-size:27px;border-radius:18px;border:3px solid;cursor:pointer;font-weight:800}
.logical{background:#eefaf2;border-color:#57ad72;color:#236c39}
.illogical{background:#fff2f3;border-color:#dc7581;color:#9c2d3a}
.title{font-size:40px;font-weight:800;text-align:center;margin:8px 0 22px}
.goodt{color:var(--green)}.badt{color:var(--red)}
.icon{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 25px;font-size:66px;font-weight:900}
.goodicon{background:#eaf8ef;border:6px solid var(--green);color:var(--green)}
.badicon{background:#fff0f2;border:6px solid var(--red);color:var(--red)}
.box{max-width:850px;margin:18px auto;padding:22px 26px;border-radius:18px;font-size:22px;line-height:1.45;text-align:center}
.goodbox{background:#f4fbf6;border:3px solid #9fd2ad}.reason{background:#fbfdff;border:3px solid #c8dcff}
.bigbtn{display:block;margin:30px auto 0;padding:15px 40px;border:3px solid;font-size:22px;cursor:pointer;border-radius:14px;font-weight:700}
.continue{border-color:#62b77a;color:#1b6d35;background:#e5f6e9}.retry{border-color:#e58c98;color:#a52738;background:#fff1f2}
.done{text-align:center;font-size:36px;font-weight:800;color:var(--blue);margin-top:85px}.score{text-align:center;font-size:60px;font-weight:900;margin:25px 0}
@media(max-width:700px){.screen{padding:24px 18px}.question{font-size:24px;min-height:240px}.options{grid-template-columns:1fr}.choice{font-size:24px}}
</style></head>
<body><div class="wrap"><div class="card">
<div class="top">Tecnología: ¿Lógico o ilógico?</div>
<div class="sub">Lee la oración y decide si tiene sentido.</div>
<div id="progress" class="progress"></div>

<section id="qScreen" class="screen active">
<div id="question" class="question"></div>
<div class="options">
<button class="choice logical" onclick="choose('Lógico')">Lógico</button>
<button class="choice illogical" onclick="choose('Ilógico')">Ilógico</button>
</div>
</section>

<section id="correctScreen" class="screen">
<div class="title goodt">¡Correcto!</div><div class="icon goodicon">✓</div>
<div id="correctAnswer" class="box goodbox"></div><div id="correctReason" class="box reason"></div>
<button id="continue" class="bigbtn continue">Continuar</button>
</section>

<section id="wrongScreen" class="screen">
<div class="title badt">Inténtalo de nuevo</div><div class="icon badicon">×</div>
<div id="wrongReason" class="box reason"></div>
<button id="retry" class="bigbtn retry">Intentar otra vez</button>
</section>

<section id="doneScreen" class="screen">
<div class="done">¡Terminaste!</div><div id="score" class="score"></div>
<button id="restart" class="bigbtn continue">Practicar otra vez</button>
</section>
</div></div>

<script>
const originalQuestions=[{"q":"Mi celular tiene poca batería, así que lo conecto al cargador.","a":"Lógico","why":"Si la batería está baja, es lógico conectar el celular al cargador."},{"q":"Quiero escuchar música en privado, así que uso los audífonos.","a":"Lógico","why":"Los audífonos sirven para escuchar audio sin molestar a otras personas."},{"q":"La batería está al 2%, pero decido no cargar el celular durante todo el día.","a":"Ilógico","why":"Con una batería casi agotada, normalmente sería necesario cargar el celular."},{"q":"Para entrar en mi cuenta, escribo mi contraseña.","a":"Lógico","why":"La contraseña se usa para acceder a una cuenta."},{"q":"Olvido mi contraseña, así que cambio el volumen del celular.","a":"Ilógico","why":"Cambiar el volumen no ayuda a recuperar una contraseña."},{"q":"Quiero mandar un mensaje de texto, así que tecleo en el celular.","a":"Lógico","why":"Teclear es una manera lógica de escribir un mensaje."},{"q":"Recibo una llamada, así que contesto el celular.","a":"Lógico","why":"Contestar es una respuesta normal cuando suena el celular."},{"q":"Mi celular suena, así que lo pongo dentro de la impresora.","a":"Ilógico","why":"Una impresora no se usa para contestar ni silenciar una llamada."},{"q":"Quiero hablar con mi amiga que vive lejos, así que hacemos una videollamada.","a":"Lógico","why":"Una videollamada permite hablar y verse a distancia."},{"q":"Para sacar una foto de la pantalla, hago una captura de pantalla.","a":"Lógico","why":"Una captura de pantalla guarda una imagen de lo que aparece en la pantalla."},{"q":"Quiero imprimir un documento, así que uso la impresora.","a":"Lógico","why":"La impresora sirve para imprimir documentos."},{"q":"Quiero imprimir un documento, así que lo borro.","a":"Ilógico","why":"Borrar el documento elimina el archivo en vez de imprimirlo."},{"q":"Guardo mis archivos importantes en la nube para tener una copia.","a":"Lógico","why":"La nube se usa para guardar y acceder a archivos."},{"q":"Quiero proteger mi cuenta, así que comparto mi contraseña con desconocidos.","a":"Ilógico","why":"Compartir una contraseña con desconocidos reduce la seguridad."},{"q":"Uso un filtro para cambiar cómo se ve una foto.","a":"Lógico","why":"Los filtros modifican la apariencia de fotos o videos."},{"q":"Para hacer una búsqueda en Internet, uso un sitio web o un buscador.","a":"Lógico","why":"Una búsqueda en Internet se realiza con herramientas en línea."},{"q":"Para descargar un archivo, primero necesito encontrar el enlace correcto.","a":"Lógico","why":"Muchos archivos se descargan desde un enlace."},{"q":"Para cargar mi tableta, la conecto al ratón.","a":"Ilógico","why":"La tableta normalmente se conecta a un cargador, no a un ratón."},{"q":"El teclado sirve para teclear.","a":"Lógico","why":"Teclear es la función principal de un teclado."},{"q":"El ratón sirve para subir el volumen del altavoz siempre.","a":"Ilógico","why":"El ratón se usa principalmente para mover el puntero y hacer clic."},{"q":"Quiero compartir una página con mi compañero, así que le mando el enlace.","a":"Lógico","why":"Enviar el enlace es una forma directa de compartir una página."},{"q":"Quiero mantener mi perfil privado, así que reviso los ajustes de privacidad.","a":"Lógico","why":"Los ajustes permiten controlar la privacidad del perfil."},{"q":"Mi perfil es privado, así que toda persona en Internet puede ver todo lo que publico.","a":"Ilógico","why":"Un perfil privado limita quién puede ver el contenido."},{"q":"Tengo una llamada perdida, así que puedo llamar a la persona después.","a":"Lógico","why":"Una llamada perdida indica que alguien llamó y no contestaste."},{"q":"Quiero marcar un número de teléfono, así que uso los números del teclado del celular.","a":"Lógico","why":"Marcar es introducir un número para hacer una llamada."},{"q":"Para guardar un archivo, cierro la computadora sin guardar nada.","a":"Ilógico","why":"Cerrar sin guardar puede hacer que se pierdan los cambios."},{"q":"Organizo mis documentos en carpetas.","a":"Lógico","why":"Las carpetas sirven para organizar archivos."},{"q":"Para encontrar una foto específica, la escondo dentro de una carpeta sin nombre.","a":"Ilógico","why":"Eso haría más difícil encontrarla."},{"q":"Quiero copiar una oración y ponerla en otro documento, así que uso copiar y pegar.","a":"Lógico","why":"Copiar y pegar mueve una copia del contenido a otro lugar."},{"q":"Quiero pegar texto, así que primero lo copio o lo corto.","a":"Lógico","why":"Normalmente hay que copiar o cortar algo antes de pegarlo."},{"q":"Quiero borrar una foto, así que hago clic en borrar.","a":"Lógico","why":"La opción borrar elimina el archivo o la foto."},{"q":"Quiero conservar una foto importante, así que la borro permanentemente.","a":"Ilógico","why":"Borrar permanentemente elimina algo que querías conservar."},{"q":"Mi computadora está muy lenta, así que cierro algunas aplicaciones que no necesito.","a":"Lógico","why":"Cerrar aplicaciones innecesarias puede ayudar cuando un dispositivo está lento."},{"q":"Mi computadora está lenta, así que abro veinte aplicaciones más.","a":"Ilógico","why":"Abrir más aplicaciones puede hacer que el dispositivo funcione aún más lento."},{"q":"Quiero estar al día con una cuenta, así que la sigo en las redes sociales.","a":"Lógico","why":"Seguir una cuenta ayuda a ver sus publicaciones nuevas."},{"q":"No quiero ver más publicaciones de una cuenta, así que la sigo para recibir más contenido.","a":"Ilógico","why":"Seguir una cuenta normalmente muestra más de su contenido."},{"q":"Quiero publicar una foto, así que la subo a las redes sociales.","a":"Lógico","why":"Subir una foto es parte del proceso de publicarla en línea."},{"q":"Quiero proteger información privada, así que la publico para todo el mundo.","a":"Ilógico","why":"Publicar información privada para todos reduce la privacidad."},{"q":"Antes de entregar una tarea digital, reviso que el archivo correcto esté adjunto.","a":"Lógico","why":"Es lógico comprobar el archivo antes de entregarlo."},{"q":"Para entregar una tarea digital, apago la computadora sin subir ningún archivo.","a":"Ilógico","why":"Apagar el dispositivo no entrega la tarea."},{"q":"Uso un nombre de usuario para identificar mi cuenta.","a":"Lógico","why":"El nombre de usuario identifica una cuenta o usuario."},{"q":"La contraseña debe ser exactamente igual para todas mis cuentas y además la publico.","a":"Ilógico","why":"Reutilizar y publicar contraseñas es inseguro."},{"q":"Para mejorar la ciberseguridad, uso una contraseña difícil de adivinar.","a":"Lógico","why":"Una contraseña fuerte ayuda a proteger una cuenta."},{"q":"La ciberseguridad significa compartir toda tu información personal con desconocidos.","a":"Ilógico","why":"La ciberseguridad busca proteger información y sistemas."},{"q":"Quiero mostrar algo de mi computadora a toda la clase, así que uso el proyector.","a":"Lógico","why":"Un proyector muestra la pantalla a un grupo."},{"q":"Quiero escuchar una llamada en voz alta, así que uso el altavoz.","a":"Lógico","why":"El altavoz permite oír una llamada sin sostener el teléfono junto al oído."},{"q":"Para tomarme una selfie, uso la cámara del celular.","a":"Lógico","why":"La cámara del celular se usa para tomarse selfies."},{"q":"Para cargar la batería, tomo una captura de pantalla.","a":"Ilógico","why":"Una captura de pantalla no carga la batería."},{"q":"Quiero etiquetar a mi amiga en una publicación para que vea la foto.","a":"Lógico","why":"Etiquetar conecta a una persona con una publicación."},{"q":"Quiero mantener un archivo valioso seguro, así que lo dejo sin guardar y lo borro.","a":"Ilógico","why":"Si es valioso, es mejor guardarlo y protegerlo."}];
let questions=[],i=0,correct=0;
function shuffle(a){const c=[...a];for(let k=c.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[c[k],c[j]]=[c[j],c[k]]}return c}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function render(){const item=questions[i];document.getElementById('progress').textContent=`Pregunta ${i+1} de ${questions.length}`;document.getElementById('question').textContent=item.q;show('qScreen')}
function choose(ans){const item=questions[i];if(ans===item.a){correct++;document.getElementById('correctAnswer').textContent=item.a;document.getElementById('correctReason').textContent=item.why;show('correctScreen')}else{document.getElementById('wrongReason').textContent=item.why;show('wrongScreen')}}
document.getElementById('retry').onclick=render;
document.getElementById('continue').onclick=()=>{i++;if(i>=questions.length)finish();else render()};
document.getElementById('restart').onclick=start;
function finish(){document.getElementById('progress').textContent='';document.getElementById('score').textContent=`${correct} / ${questions.length}`;show('doneScreen')}
function start(){questions=shuffle(originalQuestions);i=0;correct=0;render()}
start();
</script></body></html>
